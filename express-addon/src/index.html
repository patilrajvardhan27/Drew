<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redraft</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        color: #0a0a0a;
        font: 400 14px/1.5 "adobe-clean", Inter, "Helvetica Neue", Arial, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: #666666;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 96px;
        padding: 8px;
        border: 1px solid #000000;
        border-radius: 8px;
        background: #f3f3f3;
        font: inherit;
        resize: vertical;
      }
      textarea:focus-visible,
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1100ff;
      }
      button {
        width: 100%;
        margin-top: 12px;
        min-height: 36px;
        border: 0;
        border-radius: 8px;
        background: #0a0a0a;
        color: #ffffff;
        font: 600 14px/1 inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
      }
      #status[data-tone="error"] {
        color: #8a1c1c;
      }
      #status[data-tone="success"] {
        color: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <h1>Import from Redraft</h1>
    <p>In Redraft, open a document and choose Create Express link. Paste it here within 15 minutes.</p>
    <form id="import-form">
      <label for="link">Redraft link</label>
      <textarea id="link" required spellcheck="false"></textarea>
      <button id="import" type="submit" disabled>Import PDF</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="index.js"></script>
  </body>
</html>
